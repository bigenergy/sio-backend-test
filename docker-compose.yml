services:
    sio_test:
        user: app
        build:
            context: .
            args:
                USER_ID: ${USER_ID:-1000}
        ports:
            - "8337:8337"
        volumes:
            - .:/app:rw
            - app_var:/app/var
        depends_on:
            database:
                condition: service_healthy

    database:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: app
            POSTGRES_USER: app
            POSTGRES_PASSWORD: app
        volumes:
            - database_data:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U app -d app" ]
            interval: 5s
            timeout: 5s
            retries: 10
        ports:
            - "5433:5432"

volumes:
    database_data:
    app_var:
